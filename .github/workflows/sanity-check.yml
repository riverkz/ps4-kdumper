---
name: "Sanity Check"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Environment"
        run: |
          git clone --depth 1 https://github.com/Scene-Collective/ps4-payload-sdk "$HOME/ps4-payload-sdk"

      # The SDK is used straight out of the clone. Its install.sh is marked
      # DEPRECATED upstream: it wants root, rewrites /etc/profile, and re-runs
      # apt-get -- a second, unnecessary apt run whose non-zero status GitHub
      # reports as this step failing. None of that is needed: the payload build
      # only wants a built libPS4 and PS4SDK pointing at it.
      - name: "Build SDK"
        run: |
          PS4SDK="$HOME/ps4-payload-sdk"
          make -C "$PS4SDK/libPS4"
          test -f "$PS4SDK/libPS4/libPS4.a"
          test -f "$PS4SDK/libPS4/linker.x"
          echo "PS4SDK=$PS4SDK" >> "$GITHUB_ENV"

      - name: "Build Payload"
        run: |
          make
          ls -l ./*.bin ./*.map

      - name: "Upload Binary Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: payload
          path: ./*.bin
          if-no-files-found: error

      - name: "Upload Map Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: map
          path: ./*.map
          if-no-files-found: error

