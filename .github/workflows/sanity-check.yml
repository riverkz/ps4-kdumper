---
name: "Sanity Check"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The SDK's install.sh only exports PS4SDK into its own shell, so the
      # location has to be repeated here. It is /opt/ps4sdk on the CI image.
      PS4SDK: /opt/ps4sdk
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils
          git clone --depth 1 https://github.com/Scene-Collective/ps4-payload-sdk ~/ps4-payload-sdk
          cd ~/ps4-payload-sdk
          chmod +x install.sh
          sudo ./install.sh
          test -f "$PS4SDK/libPS4/libPS4.a"

      - name: "Build Payload"
        run: |
          make
          ls -l ./*.bin ./*.map

      - name: "Upload Binary Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: payload
          path: ./*.bin
          if-no-files-found: error

      - name: "Upload Map Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: map
          path: ./*.map
          if-no-files-found: error

